name: UniMessenger
options:
  bundleIdPrefix: de.hsd-hamburg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  UniMessenger:
    type: application
    platform: iOS
    sources: [UniMessenger]
    info:
      path: UniMessenger/Info.plist
      properties:
        CFBundleDisplayName: OS
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsWriteOnlyAccessUsageDescription: OS trägt von der KI erkannte Termine auf Ihren Wunsch in den Kalender ein.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hsd-hamburg.UniMessenger
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [UniMessengerTests]
  UniMessengerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UniMessengerTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UniMessenger
