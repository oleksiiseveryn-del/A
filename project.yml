name: UniMessenger
options:
  bundleIdPrefix: de.hsd-hamburg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  UniMessenger:
    type: application
    platform: iOS
    sources: [UniMessenger]
    info:
      path: UniMessenger/Info.plist
      properties:
        CFBundleDisplayName: UniMessenger
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.hsd-hamburg.UniMessenger.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hsd-hamburg.UniMessenger
        TARGETED_DEVICE_FAMILY: "1"
  UniMessengerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UniMessengerTests]
    dependencies:
      - target: UniMessenger
