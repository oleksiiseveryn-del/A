name: Web-App veröffentlichen

# Publishes the app to GitHub Pages: https://oleksiiseveryn-del.github.io/A/
# (index.html at the root forwards to web/, where the PWA lives).
on:
  push:
    branches: [main, claude/unified-messenger-iphone-app-67g1uc]
    paths: ["web/**", "index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r web _site/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
